# Chat function tools need no configuration; strict schemas are opt-in.
[server]
bind = "127.0.0.1"
port = 8317
log_filter = "info"

[auth]
callback_bind_host = "127.0.0.1"
redirect_host = "localhost"
callback_port = 1455
open_browser = true
timeout_seconds = 300

# Docker auth note:
# - the container image uses config.docker.toml instead of this file
# - if you mount a custom config into Docker, set:
#     callback_bind_host = "0.0.0.0"
#     redirect_host = "localhost"

[upstream]
responses_base_url = "https://chatgpt.com/backend-api"
codex_responses_path = "/codex/responses"
codex_compact_path = "/codex/responses/compact"
authorize_url = "https://auth.openai.com/oauth/authorize"
token_url = "https://auth.openai.com/oauth/token"
client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
scope = "openid profile email offline_access"
originator = "codex_cli_rs"
beta_header = "responses=experimental"
keep_alive_interval_secs = 15

[request_defaults]
include = ["reasoning.encrypted_content"]

[models]
advertised = ["gpt-5.4", "gpt-5.4-mini", "gpt-5.3-codex"]
# Legacy compatibility field; unknown models are rejected in this fork.
fallback = "gpt-5.4"

[models.aliases]
"openai/gpt-5.4" = "gpt-5.4"
"openai/gpt-5.4-mini" = "gpt-5.4-mini"
"openai/gpt-5.3-codex" = "gpt-5.3-codex"
"openai/gpt-5-codex" = "gpt-5.3-codex"
"gpt-5-codex" = "gpt-5.3-codex"

# Optional alias profile, independent of global request defaults:
# [models.reasoning_efforts]
# "gpt-5-codex" = "xhigh"
